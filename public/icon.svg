<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="#0B0F17"/>
  <rect x="16" y="16" width="480" height="480" rx="94" stroke="#38BDF8" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Centered keyboard graphic -->
  <g transform="translate(56, 76)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="80" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="100" y="0" width="80" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="200" y="0" width="80" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="300" y="0" width="100" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>

    <!-- Row 2 -->
    <rect x="0" y="80" width="95" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="115" y="80" width="80" height="60" rx="10" fill="#0369A1" stroke="#38BDF8" stroke-width="5"/>
    <text x="145" y="122" fill="#E0F2FE" font-family="monospace" font-size="32" font-weight="bold">R</text>
    <rect x="215" y="80" width="80" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="315" y="80" width="85" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>

    <!-- Row 3: Code symbols & Caret -->
    <rect x="0" y="160" width="115" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="135" y="160" width="80" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="235" y="160" width="80" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>
    <rect x="335" y="160" width="65" height="60" rx="10" fill="#1F2937" stroke="#374151" stroke-width="4"/>

    <!-- Row 4: Spacebar & Code Caret -->
    <path d="M40 260L10 280L40 300" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="80" y="255" width="240" height="50" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="5"/>
    <path d="M360 260L390 280L360 300" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulsing glowing vertical caret -->
    <rect x="200" y="240" width="8" height="40" rx="4" fill="#4ADE80"/>
  </g>
</svg>
